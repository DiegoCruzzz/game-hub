<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <header class="hub-header">
        <h1>Game<span>Hub</span></h1>
        <p>Tu colección de juegos offline</p>
    </header>

    <main class="grid-container">
        <a href="games/sudoku/index.html" class="game-card">
            <div class="card-icon">🔢</div>
            <div class="card-content">
                <h2>Sudoku</h2>
                <p>El clásico rompecabezas numérico con un diseño moderno.</p>
            </div>
        </a>
        
        <a href="games/rompebloques/index.html" class="game-card">
            <div class="card-icon">🧱</div>
            <div class="card-content">
                <h2>Rompebloques</h2>
                <p>Destruye todos los bloques antes de que caiga la bola.</p>
            </div>
        </a>

        <a href="games/2048/index.html" class="game-card">
            <div class="card-icon">🧩</div>
            <div class="card-content">
                <h2>2048</h2>
                <p>Une los números para llegar a la mítica ficha 2048.</p>
            </div>
        </a>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW registered', reg))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
